name: Avviso Fiera Rimini

on:
  schedule:
    - cron: "0 */6 * * *"  # ogni 6 ore (alle 00, 06, 12, 18 UTC)
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write          # serve per salvare i file di stato

concurrency:
  group: avviso-fiera
  cancel-in-progress: false

jobs:
  avviso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Esegui bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          DAYS_BEFORE: "4"
        run: python bot.py

      - name: Salva stato
        run: |
          git config user.name "fiera-bot"
          git config user.email "fiera-bot@users.noreply.github.com"
          git add stato_inviati.json eventi_noti.json calendario.json
          git diff --staged --quiet || (git commit -m "Aggiorna stato avvisi" && git push)
